name: Publish Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.0.0)'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release & Attach Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }}
          name: "FiiO JA11 Studio ${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }} — Pure Native Android 120Hz & WebHID PWA"
          body: |
            ## 🎧 FiiO / JadeAudio JA11 Studio (${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }})
            
            Bộ điều khiển DSP PEQ 5-Band thời gian thực, Âm lượng phần cứng DAC (0–60), Máy quét cộng hưởng ống tai (Ear Peak Sweep) và Kho Profile Offline/Online dành cho **FiiO / JadeAudio JA11**.
            
            ### 📱 Cài đặt trên Điện thoại Android (`JA11-Studio-v3.0.apk`)
            - **100% Pure Native Android (Zero WebView):** Đồ thị Skia Canvas mượt 120Hz, chụm 2 ngón (Pinch) đổi độ rộng `Q`, phát sóng Sin `AudioTrack` PCM 48kHz.
            - **USB-C OTG HID thông minh:** Tự nhận diện đúng kênh Vendor DSP `Report ID = 2` (kể cả khi bật Inline Mic), tách biệt hoàn toàn nghe thử Live trên RAM với lưu cứng Flash NVRAM (`0x19`).
            - Tải file **`JA11-Studio-v3.0.apk`** bên dưới mục **Assets** và cài đặt trực tiếp.
            
            ### 💻 Sử dụng trực tiếp trên Máy tính (Không cần cài đặt)
            - Mở trang **GitHub Pages** bằng **Chrome / Edge / Opera**, cắm JA11 vào cổng USB và bấm **Kết nối**.
          files: |
            release/JA11-Studio-v3.0.apk
          draft: false
          prerelease: false
